name: Repère CI - Tests de routage
on:
  pull_request:
    paths:
      - 'repere-routing.js'
      - 'repere-app.js'
      - 'repere-west-africa.js'
      - 'repere-poi.js'
      - 'repere-3d.js'
      - 'data/arcgis/**'
      - 'scripts/**'
      - 'docs/arcgis-pro.md'
      - 'tests/**'
      - '.github/workflows/routing-tests.yml'
  push:
    branches: [main]
    paths:
      - 'repere-routing.js'
      - 'repere-app.js'
      - 'repere-west-africa.js'
      - 'repere-poi.js'
      - 'repere-3d.js'
      - 'data/arcgis/**'
      - 'scripts/**'
      - 'docs/arcgis-pro.md'
      - 'tests/**'
      - '.github/workflows/routing-tests.yml'
jobs:
  routing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check repere-routing.js
          node --check repere-app.js
          node --check repere-west-africa.js
          node --check repere-poi.js
          node --check repere-3d.js
          node --check scripts/export-arcgis-geojson.cjs
          node scripts/export-arcgis-geojson.cjs --check
      - name: Exécuter les tests de routage
        run: node --test tests/*.test.cjs
